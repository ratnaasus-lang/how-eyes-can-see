<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>How Eyes Can See</title>

<style>
    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background: #dff6ff;
        font-family: Arial, sans-serif;
    }

    h1 {
        margin-bottom: 30px;
    }

    .eye {
        width: 260px;
        height: 170px;
        background: white;
        border: 5px solid #222;
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .iris {
        width: 100px;
        height: 100px;
        background: #6b8e23;
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .pupil {
        width: 45px;
        height: 45px;
        background: #111;
        border-radius: 50%;
        transition: 0.4s;
    }

    .pupil.small {
        width: 20px;
        height: 20px;
    }

    button {
        margin-top: 30px;
        padding: 14px 25px;
        font-size: 18px;
        border: none;
        border-radius: 12px;
        background: #222;
        color: white;
    }
</style>
</head>

<body>

<h1>How Eyes Can See 👁️</h1>

<div class="eye">
    <div class="iris">
        <div class="pupil" id="pupil"></div>
    </div>
</div>

<button onclick="changePupil()">
    Cahaya Terang ☀️
</button>

<script>
function changePupil() {
    document.getElementById("pupil").classList.toggle("small");
}
</script>

</body>
</html>
