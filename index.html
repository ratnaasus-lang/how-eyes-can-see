<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>How Eyes Can See</title>
  
  <style>

body {
    font-family: Arial, sans-serif;
    text-align: center;
}
h1 {
    font-size: 36px;
    color: #2b6cb0;
}
button {
    font-size: 18px;
    padding: 12px 24px;
    border: none;
    border-radius: 10px;
}
.eye {
    width: 200px;
    height: 120px;
    background: white;
    border: 4px solid black;
    border-radius: 50%;
    margin: 30px auto;
}
.iris {
    width: 70px;
    height: 70px;
    background: #4a90e2;
    border-radius: 50%;
    margin: 25px auto;
}
.pupil {
    width: 30px;
    height: 30px;
    background: black;
    border-radius: 50%;
    margin: 20px auto;
}
.highlight {
    width: 10px;
    height: 10px;
    background: white;
    border-radius: 50%;
    position: relative;
    top: -25px;
    left: 10px;
}
</style>
</head>
<body>

  <h1>How Eyes Can See 👁️</h1>

  <p>Saya sedang belajar bagaimana mata bisa melihat.</p>
  
<div class="eye">
    <div class="iris">
        <div class="pupil">
    <div class="highlight"></div>
</div>
    </div>
</div>
  <button onclick="mulaiBelajar()">
    Mulai
</button>
<script>
function mulaiBelajar() {
    alert("Mari kita belajar bagaimana mata bisa melihat! 👁️");
}
</script>

  <p id="hasil"></p>
  

  <script>
    function mulai() {
      document.getElementById("hasil").innerText =
        "Cahaya masuk lewat kornea, difokuskan lensa, ditangkap retina, lalu dikirim ke otak lewat saraf optik.";
    }
  </script>

</body>
</html>
